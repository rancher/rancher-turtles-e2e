# This workflow calls the master E2E workflow with custom variables,
# once per Rancher version given in the rancher_version input
name: UI-E2E
run-name: >-
  ${{
    github.event_name == 'workflow_dispatch' &&
    format(
      '[{0}] Rancher-`{1}` - `{2}` destroy={3} dev={4}',
      github.run_number,
      inputs.rancher_version,
      inputs.grep_test_by_tag,
      inputs.destroy_runner,
      inputs.turtles_dev_chart
    ) ||
    github.event_name == 'schedule' &&
    (
      github.event.schedule == '0 3 * * *' && format('[{0}] Nightly e2e job for `@short`', github.run_number) ||
      github.event.schedule == '5 3 * * *' && format('[{0}] Nightly e2e job for `@short @aarch64`', github.run_number) ||
      github.event.schedule == '0 4 * * *' && format('[{0}] Nightly e2e job for `@vsphere`', github.run_number) ||
      github.event.schedule == '0 4 * * 0' && format('[{0}] Weekly e2e job for `@full`', github.run_number) ||
      github.event.schedule == '0 3 * * 6' && format('[{0}] Weekly e2e job for `@migration`', github.run_number) ||
      github.event.schedule == '0 5 * * 0' && format('[{0}] Weekly e2e job for `@upgrade`', github.run_number) ||
      'Unknown scheduled job'
    )
  }}

on:
  workflow_dispatch:
    inputs:
      rancher_version:
        description: >-
          Rancher Manager versions, separated by spaces or commas, one test run each.
          Entry format - <version>[:<upgrade_version>], each as channel/<version|head_version>[/head_version];
          <upgrade_version> is used for post-upgrade/post-migration (e.g. head/2.16 head/2.13:head/2.14)
        default: head/2.16
        type: string
      grep_test_by_tag:
        description: Test tags. For multiple selection separate with spaces (Available options - @install [@migration @upgrade @short @full | @vsphere]). Keep always @install
        required: true
        type: string
        default: '@install @short'
      target_build_type:
        description: Build type for turtles_dev_chart (prime|community)
        default: 'prime'
        type: string
      cluster_name_suffix:
        description: Suffix to be used in cluster name (default - github.run_number)
        type: string
      turtles_dev_chart:
        description: Install rancher turtles dev chart
        default: true
        type: boolean
      destroy_runner:
        description: Destroy the auto-generated self-hosted runner
        default: true
        type: boolean
      skip_cluster_delete:
        description: Skip CAPI cluster and fleet repo deletion tests
        default: false
        type: boolean
      qase_report:
        description: Report to QASE
        default: false
        type: boolean
      max_parallel:
        description: Maximum number of Rancher versions tested in parallel (forced to 1 for @vsphere)
        default: 5
        type: number
      runner_template:
        description: Runner template to use
        default: rancher-turtles-e2e-ci-amd64-spot-20261014-1255
        type: choice
        options:
          - rancher-turtles-e2e-ci-amd64-spot-20261014-1255
          - rancher-turtles-e2e-ci-amd64-standard-20261014-1253
          - rancher-turtles-e2e-ci-aarch64-spot-20261014-1233
          - rancher-turtles-e2e-ci-aarch64-standard-20261014-1233
  schedule:
    - cron: '0 3 * * *' # @short
    - cron: '5 3 * * *' # @short @aarch64
    - cron: '0 4 * * *' # @vsphere
    - cron: '0 4 * * 0' # @full on Sundays only
    - cron: '0 3 * * 6' # @migration @short on Saturdays only
    - cron: '0 5 * * 0' # @upgrade on Sundays only

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build Rancher versions matrix
        id: matrix
        env:
          VERSIONS: ${{ inputs.rancher_version || 'head/2.16' }}
        run: |
          # "head/2.16 head/2.13:head/2.14" ->
          # [{"rancher_version":"head/2.13","rancher_upgrade_version":"head/2.14"},{"rancher_version":"head/2.16"}]
          MATRIX=$(jq -cRn --arg v "${VERSIONS}" '
            $v | split("[ ,]+"; null) | map(select(length > 0))
            | map(
                split(":") as $p
                | if ($p | length) > 2 or ($p[0] | length) == 0 then
                    error("Invalid entry \"\(.)\", expected <version>[:<upgrade_version>]")
                  else
                    {rancher_version: $p[0]}
                    + (if ($p[1] // "") != "" then {rancher_upgrade_version: $p[1]} else {} end)
                  end
              )
            | unique') || exit 1
          if [[ "${MATRIX}" == "[]" ]]; then
            echo "ERROR: no Rancher version provided"
            exit 1
          fi
          echo "matrix=${MATRIX}" | tee -a "${GITHUB_OUTPUT}"

  ui:
    needs: prepare
    strategy:
      fail-fast: false
      # vSphere tests share a single self-hosted runner and kube-vip IP pool
      # Dispatch inputs arrive as strings here, but max-parallel needs a number, hence fromJSON
      max-parallel: ${{ contains(inputs.grep_test_by_tag, '@vsphere') && 1 || fromJSON(format('{0}', inputs.max_parallel || 5)) }}
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/master-e2e.yaml
    secrets:
      gcp_credentials: ${{ secrets.GCP_CREDENTIALS }}
      gcp_project: ${{ secrets.GCP_PROJECT }}
      pat_token: ${{ secrets.SELF_HOSTED_RUNNER_PAT_TOKEN }}
      aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
      azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      qase_api_token: ${{ secrets.QASE_API_TOKEN }}
      rancher_password: ${{ secrets.RANCHER_PASSWORD }}
      vsphere_secrets_json_base64: ${{ secrets.VSPHERE_SECRETS_JSON_BASE64 }}
      vsphere_endpoints_list: ${{ secrets.VSPHERE_ENDPOINTS_LIST }}
      docker_auth_username: ${{ secrets.DOCKER_AUTH_USERNAME }}
      docker_auth_password: ${{ secrets.DOCKER_AUTH_PASSWORD }}
      docker_registry_config: ${{ secrets.DOCKER_REGISTRY_CONFIG }}
      prime_registry: ${{ secrets.PRIME_REGISTRY }}
      stg_prime_registry: ${{ secrets.STG_PRIME_REGISTRY }}
      prime_artifacts_url: ${{ secrets.PRIME_ARTIFACTS_URL }}
      log_encryption_key: ${{ secrets.LOG_ENCRYPTION_KEY }}
    with:
      test_description: "UI - e2e tests with Standard K3s"
      destroy_runner: ${{ github.event_name == 'schedule' && true || inputs.destroy_runner }}
      rancher_version: ${{ matrix.rancher_version }}
      rancher_upgrade_version: ${{ matrix.rancher_upgrade_version || '' }}
      qase_report: ${{ inputs.qase_report == true || (github.event_name == 'schedule' && true) }}
      turtles_dev_chart: ${{ inputs.turtles_dev_chart == true || (github.event_name == 'schedule' && true) }}
      target_build_type: ${{ inputs.target_build_type || 'prime' }}
      skip_cluster_delete: ${{ inputs.skip_cluster_delete || (github.event_name == 'schedule' && false) }}
      runner_template: ${{ inputs.runner_template || (github.event.schedule == '5 3 * * *' && 'rancher-turtles-e2e-ci-aarch64-spot-20261014-1233') || 'rancher-turtles-e2e-ci-amd64-spot-20261014-1255' }}
      # With several versions, the matrix index is appended so cluster and artifact names don't clash
      cluster_name_suffix: >-
        ${{ strategy.job-total > 1 &&
        format('{0}-{1}', inputs.cluster_name_suffix || github.run_number, strategy.job-index) ||
        (inputs.cluster_name_suffix || github.run_number) }}
      grep_test_by_tag: >-
        ${{ inputs.grep_test_by_tag ||
        (github.event.schedule == '0 3 * * *' && '@install @short') ||
        (github.event.schedule == '5 3 * * *' && '@install @short @aarch64') ||
        (github.event.schedule == '0 4 * * *' && '@install @vsphere') ||
        (github.event.schedule == '0 4 * * 0' && '@install @full') ||
        (github.event.schedule == '0 3 * * 6' && '@install @migration') ||
        (github.event.schedule == '0 5 * * 0' && '@install @upgrade') }}
