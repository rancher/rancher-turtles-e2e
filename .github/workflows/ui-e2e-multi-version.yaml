# This workflow calls the master E2E workflow once per Rancher version, with the same custom variables
name: UI-E2E (multi-version)
run-name: >-
  ${{
    format(
      '[{0}] Rancher-`{1}` - `{2}` destroy={3} dev={4}',
      github.run_number,
      inputs.rancher_versions,
      inputs.grep_test_by_tag,
      inputs.destroy_runner,
      inputs.turtles_dev_chart
    )
  }}

on:
  workflow_dispatch:
    inputs:
      rancher_versions:
        description: >-
          Rancher Manager versions, separated by spaces or commas, one test run each.
          Entry format - <version>[:<upgrade_version>], each as channel/<version|head_version>[/head_version];
          <upgrade_version> is used for post-upgrade/post-migration (e.g. head/2.16 head/2.13:head/2.14)
        required: true
        default: prime-head/2.16 prime-head/2.15 prime-head/2.14
        type: string
      grep_test_by_tag:
        description: Test tags. For multiple selection separate with spaces (Available options - @install [@migration @upgrade @short @full]; @vsphere/@capv are not supported here, use UI-E2E). Keep always @install
        required: true
        type: string
        default: '@install @short'
      target_build_type:
        description: Build type for turtles_dev_chart (prime|community)
        default: 'prime'
        type: string
      turtles_dev_chart:
        description: Install rancher turtles dev chart
        default: false
        type: boolean
      destroy_runner:
        description: Destroy the auto-generated self-hosted runners
        default: true
        type: boolean
      skip_cluster_delete:
        description: Skip CAPI cluster and fleet repo deletion tests
        default: false
        type: boolean
      qase_report:
        description: Report to QASE
        default: false
        type: boolean
      runner_template:
        description: Runner template to use
        default: rancher-turtles-e2e-ci-amd64-spot-20261014-1255
        type: choice
        options:
          - rancher-turtles-e2e-ci-amd64-spot-20261014-1255
          - rancher-turtles-e2e-ci-amd64-standard-20261014-1253
          - rancher-turtles-e2e-ci-aarch64-spot-20261014-1233
          - rancher-turtles-e2e-ci-aarch64-standard-20261014-1233

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build Rancher versions matrix
        id: matrix
        env:
          VERSIONS: ${{ inputs.rancher_versions }}
        run: |
          # "head/2.16 head/2.13:head/2.14" ->
          # [{"rancher_version":"head/2.13","rancher_upgrade_version":"head/2.14","artifact_label":"head-2.13-to-head-2.14"},
          #  {"rancher_version":"head/2.16","rancher_upgrade_version":"","artifact_label":"head-2.16"}]
          MATRIX=$(jq -cRn --arg versions "${VERSIONS}" '
            [
              $versions
              | splits("[ ,]+")
              | select(. != "")
              | split(":") as [$version, $upgrade]
              | ($upgrade // "") as $upgrade
              | {
                  rancher_version: $version,
                  rancher_upgrade_version: $upgrade,
                  # Artifact names must not contain / or :
                  artifact_label: (
                    if $upgrade == "" then $version else "\($version)-to-\($upgrade)" end
                    | gsub("[/:]"; "-")
                  )
                }
            ]
            | unique')
          echo "matrix=${MATRIX}" | tee -a "${GITHUB_OUTPUT}"

  ui:
    name: ui (${{ matrix.rancher_version }}${{ matrix.rancher_upgrade_version && format(' → {0}', matrix.rancher_upgrade_version) || '' }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/master-e2e.yaml
    secrets:
      gcp_credentials: ${{ secrets.GCP_CREDENTIALS }}
      gcp_project: ${{ secrets.GCP_PROJECT }}
      pat_token: ${{ secrets.SELF_HOSTED_RUNNER_PAT_TOKEN }}
      aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
      azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      qase_api_token: ${{ secrets.QASE_API_TOKEN }}
      rancher_password: ${{ secrets.RANCHER_PASSWORD }}
      vsphere_secrets_json_base64: ${{ secrets.VSPHERE_SECRETS_JSON_BASE64 }}
      vsphere_endpoints_list: ${{ secrets.VSPHERE_ENDPOINTS_LIST }}
      docker_auth_username: ${{ secrets.DOCKER_AUTH_USERNAME }}
      docker_auth_password: ${{ secrets.DOCKER_AUTH_PASSWORD }}
      docker_registry_config: ${{ secrets.DOCKER_REGISTRY_CONFIG }}
      prime_registry: ${{ secrets.PRIME_REGISTRY }}
      stg_prime_registry: ${{ secrets.STG_PRIME_REGISTRY }}
      prime_artifacts_url: ${{ secrets.PRIME_ARTIFACTS_URL }}
      log_encryption_key: ${{ secrets.LOG_ENCRYPTION_KEY }}
    with:
      test_description: "UI - e2e tests with Standard K3s (${{ matrix.rancher_version }})"
      destroy_runner: ${{ inputs.destroy_runner }}
      rancher_version: ${{ matrix.rancher_version }}
      rancher_upgrade_version: ${{ matrix.rancher_upgrade_version }}
      qase_report: ${{ inputs.qase_report }}
      turtles_dev_chart: ${{ inputs.turtles_dev_chart }}
      target_build_type: ${{ inputs.target_build_type || 'prime' }}
      skip_cluster_delete: ${{ inputs.skip_cluster_delete }}
      runner_template: ${{ inputs.runner_template }}
      # Unique per matrix entry so cluster names don't clash; kept short, as cluster names
      # have length limits (e.g. 40 characters on GKE) and only allow [a-z0-9-]
      cluster_name_suffix: ${{ format('{0}-{1}', github.run_number, strategy.job-index) }}
      # Unique per matrix entry and readable, e.g. 123-head-2.13-to-head-2.14
      artifact_suffix: ${{ format('{0}-{1}', github.run_number, matrix.artifact_label) }}
      grep_test_by_tag: ${{ inputs.grep_test_by_tag }}
