name: Janitor

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  aws-janitor:
    name: aws-janitor
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Cleanup
        uses: rancher/aws-janitor@84b177ff822fb41a00b892d4294769fef3815dc5 # v0.3.0
        with:
          regions: ap-south-2
          commit: true
          ignore-tag: janitor-ignore

  gcp-janitor:
    name: gcp-janitor
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
        
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        
      - name: Cleanup
        continue-on-error: true
        run: |
          # Get the GKE clusters by prefix
          for cl in $(gcloud container clusters list --location asia-south2 --filter="name:turtles-qa-gcp" --format="value(name)"); do
           echo "Deleting GKE cluster: $cl"
           gcloud container clusters delete --location asia-south2 $cl --async --quiet
          done

          # Delete Forwarding Rule
          gcloud compute forwarding-rules list --global --format="value(name)" --filter="name:turtles-qa-gcp" | xargs -r gcloud compute forwarding-rules delete  --global --quiet

          # Delete Target TCP Proxies
          gcloud compute target-tcp-proxies list  --filter="name:turtles-qa-gcp"  --format="value(name)" --global | xargs -r gcloud compute target-tcp-proxies delete --global --quiet

          # Delete Backend Services
          gcloud compute backend-services list --filter="name:turtles-qa-gcp" --format="value(name)" --global | xargs -r gcloud compute backend-services delete --global --quiet

          # Delete Instance Group
          gcloud compute instance-groups unmanaged list --zones=asia-south2-a --filter="name:turtles-qa-gcp" --format="value(name)" | xargs -r gcloud compute instance-groups unmanaged delete --zone=asia-south2-a --quiet

          # Delete Instances
          gcloud compute instances list --zones=asia-south2-a --filter="name:turtles-qa-gcp" --format="value(name)" | xargs -r gcloud compute instances delete --zone=asia-south2-a --quiet

  azure-janitor:
    name: azure-janitor
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Cleanup
        uses: rancher/azure-janitor@90a1ba53f7e37ad1e1a20455efe355c06849d84e # v0.1.2
        with:
          resource-groups: turtles-qa-azure*
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          commit: true
