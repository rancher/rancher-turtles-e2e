name: Janitor

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  aws-janitor:
    name: aws-janitor
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Cleanup
        uses: rancher/aws-janitor@84b177ff822fb41a00b892d4294769fef3815dc5 # v0.3.0
        with:
          regions: ap-south-2
          commit: true
          ignore-tag: janitor-ignore

  gcp-janitor:
    name: gcp-janitor
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Cleanup
        continue-on-error: true
        env:
          # Resources are named by getClusterName() in tests/cypress/latest/support/utils.ts
          FILTER: name:turtles-qa-gcp
          REGION: asia-south2
        run: |
          # Best-effort cleanup: keep going past individual failures instead of
          # letting the default `bash -eo pipefail` skip the remaining resources.
          set +e

          ZONES="$REGION-a,$REGION-b,$REGION-c"

          # Delete GKE clusters
          gcloud container clusters list --location "$REGION" --filter="$FILTER" --format="value(name)" \
            | xargs -r gcloud container clusters delete --location "$REGION" --async --quiet

          # Delete the global load balancer resources, front-end first
          for kind in forwarding-rules target-tcp-proxies backend-services; do
            gcloud compute "$kind" list --global --filter="$FILTER" --format="value(name)" \
              | xargs -r gcloud compute "$kind" delete --global --quiet
          done

          # Delete Instance Groups
          gcloud compute instance-groups unmanaged list --zones="$ZONES" --filter="$FILTER" --format="value(name)" \
            | xargs -r gcloud compute instance-groups unmanaged delete --quiet

          # Delete Instances
          gcloud compute instances list --zones="$ZONES" --filter="$FILTER" --format="value(name)" \
            | xargs -r gcloud compute instances delete --quiet

  azure-janitor:
    name: azure-janitor
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Cleanup
        uses: rancher/azure-janitor@47483c1c497134308c83c61b8e68ae0555c43be4 # main @ 2026-04-13 v0.1.2
        with:
          resource-groups: turtles-qa-azure*
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          commit: true
