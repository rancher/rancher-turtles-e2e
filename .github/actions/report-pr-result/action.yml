name: Report e2e result to PR
description: Append a row with the e2e run result to the "E2E Test Results" table in the description of the PR of the current branch

inputs:
  result:
    description: Result of the tested job (success|failure|cancelled|skipped)
    required: true
  run_name:
    description: Text of the table row linking to this run
    required: true
  token:
    description: Token allowed to edit the PR
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Find PR and update description with result
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
        RESULT: ${{ inputs.result }}
        RUN_NAME: ${{ inputs.run_name }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        PR_NUMBER=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
          --json number --jq '.[0].number // empty')

        if [[ -z "$PR_NUMBER" ]]; then
          echo "No open PR found for branch $BRANCH, skipping."
          exit 0
        fi

        case "$RESULT" in
          success)   STATUS="✅ Pass" ;;
          failure)   STATUS="❌ Fail" ;;
          cancelled) STATUS="⚠️ Cancelled" ;;
          skipped)   STATUS="⏭️ Skipped" ;;
          *)         STATUS="❓ Unknown" ;;
        esac

        NEW_ROW="| [${RUN_NAME}](${RUN_URL}) | ${STATUS} | |"

        # Get current PR body
        gh pr view "$PR_NUMBER" --repo "$REPO" --json body --jq '.body' > /tmp/pr_body.txt

        if grep -q '<!-- e2e-result-end -->' /tmp/pr_body.txt; then
          # Append new row before end marker (preserves all existing rows)
          sed -i "/<!-- e2e-result-end -->/i\\${NEW_ROW}" /tmp/pr_body.txt
        else
          # Fallback for legacy PRs without markers: append full section
          cat >> /tmp/pr_body.txt <<EOF

        <!-- e2e-result-start -->
        ### E2E Test Results:

        | Run Name | Run Result | Notes |
        |----------|------------|-------|
        ${NEW_ROW}
        <!-- e2e-result-end -->
        EOF
        fi

        gh pr edit "$PR_NUMBER" --repo "$REPO" --body-file /tmp/pr_body.txt
